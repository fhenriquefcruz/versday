name: VersDay CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: JavaScript syntax
        run: find js api -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Visual and security tests
        run: npm test