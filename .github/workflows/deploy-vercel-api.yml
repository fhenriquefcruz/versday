name: Deploy VersDay API to Vercel

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Vercel project name
        required: true
        default: versday-api
        type: string
      scope:
        description: Vercel account/team slug dedicated to VersDay
        required: true
        type: string
      enable_vlm:
        description: Enable multimodal validation for uncurated top finalists
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: versday-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_NAME: ${{ inputs.project_name }}
      VERCEL_SCOPE: ${{ inputs.scope }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VISUAL_VLM_ENABLED: ${{ inputs.enable_vlm }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate VersDay Vercel scope
        shell: bash
        run: |
          if [ -z "$VERCEL_SCOPE" ]; then
            echo "::error::A Vercel scope dedicated to VersDay is required."
            exit 1
          fi

          NORMALIZED_SCOPE="$(printf '%s' "$VERCEL_SCOPE" | tr '[:upper:]' '[:lower:]')"

          if [ "$NORMALIZED_SCOPE" = "rtm11" ] || [ "$NORMALIZED_SCOPE" = "rtm" ]; then
            echo "::error::RTM is a separate project. Use a Vercel account/team dedicated to VersDay."
            exit 1
          fi

      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN."
            echo "Add a Vercel token as the repository secret VERCEL_TOKEN before running this workflow."
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.19.1

      - name: Create project when needed
        shell: bash
        run: |
          set +e
          OUTPUT="$(vercel project add "$PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --yes 2>&1)"
          STATUS=$?
          set -e

          echo "$OUTPUT"

          if [ "$STATUS" -ne 0 ] && ! echo "$OUTPUT" | grep -qiE "already exists|exists already|project.*exists"; then
            exit "$STATUS"
          fi

      - name: Link repository workspace
        run: |
          vercel link \
            --yes \
            --project "$PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Sync provider configuration when supplied
        shell: bash
        run: |
          sync_env() {
            local NAME="$1"
            local VALUE="$2"

            if [ -z "$VALUE" ]; then
              echo "$NAME was not supplied as a GitHub secret; preserving any existing Vercel value."
              return 0
            fi

            vercel env rm "$NAME" production \
              --yes \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true

            printf '%s' "$VALUE" | vercel env add "$NAME" production \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" >/dev/null

            echo "$NAME synchronized to Vercel production."
          }

          sync_env "UNSPLASH_ACCESS_KEY" "$UNSPLASH_ACCESS_KEY"
          sync_env "GROQ_API_KEY" "$GROQ_API_KEY"
          sync_env "GROQ_MODEL" "qwen/qwen3.8-27b"
          sync_env "GROQ_VISION_MODEL" "qwen/qwen3.8-27b"
          sync_env "VISUAL_VLM_ENABLED" "$VISUAL_VLM_ENABLED"
          sync_env "ALLOWED_ORIGIN" "https://fhenriquefcruz.github.io"

      - name: Deploy production backend
        id: deploy
        shell: bash
        run: |
          set -o pipefail

          vercel deploy \
            --prod \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --no-color | tee deploy.log

          DEPLOY_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' deploy.log | tail -n 1)"

          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Vercel deployment completed without a detectable deployment URL."
            exit 1
          fi

          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## VersDay API deployment"
            echo ""
            echo "- Project: $PROJECT_NAME"
            echo "- Scope: $VERCEL_SCOPE"
            echo "- Production URL: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify health endpoint
        id: health
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            "$DEPLOY_URL/api/health" \
            --output health.json

          cat health.json

          node -e "
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('health.json', 'utf8'));
            if (payload.ok !== true || payload.service !== 'versday-api') {
              throw new Error('Unexpected health response');
            }
            console.log('VersDay API healthcheck passed.');
          "

          IMAGES_CONFIGURED="$(node -p 'JSON.parse(require("fs").readFileSync("health.json","utf8")).providers?.imagesConfigured === true')"
          CHAT_CONFIGURED="$(node -p 'JSON.parse(require("fs").readFileSync("health.json","utf8")).providers?.chatConfigured === true')"
          VLM_CONFIGURED="$(node -p 'JSON.parse(require("fs").readFileSync("health.json","utf8")).providers?.vlmConfigured === true')"

          echo "images=$IMAGES_CONFIGURED" >> "$GITHUB_OUTPUT"
          echo "chat=$CHAT_CONFIGURED" >> "$GITHUB_OUTPUT"
          echo "vlm=$VLM_CONFIGURED" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### Health payload"
            cat health.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages runtime endpoints
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          IMAGES_CONFIGURED: ${{ steps.health.outputs.images }}
          CHAT_CONFIGURED: ${{ steps.health.outputs.chat }}
        run: |
          node scripts/configure-backend.mjs \
            --base-url "$DEPLOY_URL" \
            --images "$IMAGES_CONFIGURED" \
            --chat "$CHAT_CONFIGURED" \
            --cache-tag "run-${GITHUB_RUN_NUMBER}"

      - name: Publish runtime endpoint configuration
        shell: bash
        run: |
          if git diff --quiet -- index.html service-worker.js; then
            echo "Runtime endpoints already match this backend state."
            exit 0
          fi

          git fetch origin main

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main changed during deployment. Re-run this workflow against the new HEAD."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "chore(runtime): activate VersDay API providers"
          git push origin HEAD:main

          {
            echo ""
            echo "### GitHub Pages runtime"
            echo "- imagesConfigured: ${{ steps.health.outputs.images }}"
            echo "- chatConfigured: ${{ steps.health.outputs.chat }}"
            echo "- vlmConfigured: ${{ steps.health.outputs.vlm }}"
            echo "- Runtime endpoints committed to main."
          } >> "$GITHUB_STEP_SUMMARY"